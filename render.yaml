# Blueprint de Render.
services:
  # Versión MÍNIMA y robusta del sistema de campañas (carpeta simple/).
  # Sin base de datos, sin compilación: solo Express + fetch. Arranca en segundos.
  - type: web
    name: campaign-system
    runtime: node
    plan: free
    rootDir: simple
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"

  # Studio: artes para Instagram con validación, aprobaciones y agente (carpeta studio/).
  # Starter + Disk: no se duerme (programaciones, revisión de los lunes) y los datos sobreviven a los despliegues.
  - type: web
    name: campaign-studio
    runtime: node
    plan: starter
    disk:
      name: studio-data
      mountPath: /var/data
      sizeGB: 1
    rootDir: studio
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: APP_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATA_DIR
        value: /var/data
